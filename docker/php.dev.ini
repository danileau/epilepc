; Dev-only PHP overrides for the epilepc container.
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
memory_limit = 512M
post_max_size = 32M
upload_max_filesize = 32M
date.timezone = Europe/Zurich

; Faster cold start in dev — opcache enabled but no file revalidation timeout.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
