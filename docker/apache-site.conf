<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # We deliberately do NOT honor public/.htaccess in dev — it contains
    # production-only directives (force https://www.epilepc.ch redirect
    # + AddHandler application/x-httpd-php81) that break a local container.
    # The Symfony rewrite is reproduced inline below instead.
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted

        DirectoryIndex index.php
        FallbackResource /index.php

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>

        # Mirror the relevant security headers from the prod .htaccess.
        Header always set X-Frame-Options "SAMEORIGIN"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/epilepc-error.log
    CustomLog ${APACHE_LOG_DIR}/epilepc-access.log combined
</VirtualHost>
