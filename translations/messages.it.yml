# --- /info/ciphra explainer page (Slice 3 extended) ---
'Der Wechsel läuft direkt zwischen deinem Browser und den beiden Diensten ab. Drei Schritte, eine Minute:': 'Il passaggio avviene direttamente tra il tuo browser e i due servizi. Tre passaggi, un minuto:'
'Migrationsfluss von epilepc über deinen Browser zu ciphra': 'Flusso di migrazione da epilepc al tuo browser fino a ciphra'
'Was passiert beim Wechsel?': 'Cosa succede durante il passaggio?'
'Dein Browser': 'Il tuo browser'
'Deine bisherigen Einträge:': 'Le tue voci esistenti:'
'Epilepsie-Blueprint wird gewählt': 'Viene selezionato il Blueprint Epilessia'
'Daten verschlüsselt mit deinem persönlichen Schlüssel': 'Dati cifrati con la tua chiave personale'
'Fertig eingerichteter Vault': 'Vault completamente configurato'
'Verschlüsselt mit deinem Schlüssel — der Server kann nicht entschlüsseln': 'Cifrato con la tua chiave — il server non può decifrare'
'ciphra baut auf dem auf, was wir mit epilepc gelernt haben — mit neueren Werkzeugen, einem breiteren Diagnose-Bereich und Browser-seitiger Verschlüsselung. Deine Daten werden in deinem Browser verschlüsselt, bevor sie den Server erreichen.': 'ciphra si basa su ciò che abbiamo imparato con epilepc — con strumenti più recenti, una gamma più ampia di diagnosi e cifratura lato browser. I tuoi dati vengono cifrati nel tuo browser prima di raggiungere il server.'
'ciphra ist die Nachfolge-Anwendung von epilepc. Daten werden in deinem Browser verschlüsselt, bevor sie an den Server gesendet werden. Der Schlüssel liegt nur bei dir — niemand sonst kann den Inhalt lesen, auch wir nicht.': 'ciphra è il successore di epilepc. I dati vengono cifrati nel tuo browser prima di essere inviati al server. La chiave rimane con te — nessun altro può leggere il contenuto, nemmeno noi.'
'ciphra arbeitet mit': 'ciphra lavora con'
'Blueprints': 'Blueprints'
'diagnose-spezifische Vorlagen, die bestimmen, was du erfassen kannst, wie deine Daten gegliedert werden und welche Diagramme ciphra für dich rendert.': 'modelli specifici per la diagnosi che definiscono cosa puoi registrare, come sono strutturati i tuoi dati e quali grafici ciphra mostra per te.'
'Wenn du von epilepc migrierst, wählt ciphra automatisch den': 'Quando migri da epilepc, ciphra seleziona automaticamente il'
'Epilepsie-Blueprint': 'Blueprint Epilessia'
'Anfallstypen, Auslöser-Liste, Notfall-Medikation, alles auf Epilepsie zugeschnitten. Deine bisherigen epilepc-Daten passen 1:1 in dieses Schema, ohne dass du etwas konfigurieren musst.': 'Tipi di crisi, lista dei trigger, farmaci di emergenza — tutto adattato all''epilessia. I tuoi dati epilepc esistenti si adattano 1:1 a questo schema, senza configurazione necessaria.'
'Verfügbare Blueprints heute:': 'Blueprint disponibili oggi:'
'Epilepsie': 'Epilessia'
'Migräne': 'Emicrania'
'Cluster-Kopfschmerz': 'Cefalea a grappolo'
'Endometriose': 'Endometriosi'
'Asthma': 'Asma'
'Morbus Crohn / Colitis': 'Crohn / Colite'
'Glaukom': 'Glaucoma'
'Bipolare Störung': 'Disturbo bipolare'
'Menopause': 'Menopausa'
'Du kannst später jederzeit zwischen Blueprints wechseln oder zusätzliche Konditionen ergänzen.': 'Puoi passare da un Blueprint all''altro o aggiungere condizioni aggiuntive in qualsiasi momento.'
'Was du gewinnst': 'Cosa guadagni'
'Verschlüsselung im Browser': 'Cifratura lato browser'
'der Schlüssel zu deinen Daten liegt nur bei dir, nicht auf dem Server.': 'la chiave dei tuoi dati rimane con te, non sul server.'
'Weitere Diagnosen': 'Più diagnosi'
'ciphra ist nicht mehr epilepsie-spezifisch und unterstützt mehrere chronische Krankheiten.': 'ciphra non è più specifico per l''epilessia e supporta più malattie croniche.'
'Familien-Sharing': 'Condivisione familiare'
'du kannst Angehörige bei der Pflege einbinden, ohne dein Passwort zu teilen.': 'puoi coinvolgere i familiari nella cura senza condividere la tua password.'
'Portable Exporte': 'Esportazioni portabili'
'wenn dich später eine andere Plattform interessiert, exportierst du dein Bundle in einem Format, das wieder importierbar ist.': 'se in futuro ti interessa un''altra piattaforma, puoi esportare il tuo bundle in un formato reimportabile.'
'ciphra wählt automatisch den Epilepsie-Blueprint': 'ciphra seleziona automaticamente il Blueprint Epilessia'
'alle Formulare, Diagramme und Vokabular sind direkt auf deine bisherigen Anfallsdaten zugeschnitten.': 'tutti i moduli, grafici e vocabolario sono direttamente adattati ai tuoi dati di crisi esistenti.'
'Deine epilepc-Daten werden im Browser verschlüsselt und in dein neues ciphra-Konto übertragen.': 'I tuoi dati epilepc vengono cifrati nel browser e trasferiti al tuo nuovo account ciphra.'
'Du landest auf deinem Dashboard — gleiche Daten, neues Zuhause.': 'Arrivi sulla tua dashboard — stessi dati, nuova casa.'
'Wann musst du handeln?': 'Quando devi agire?'
'epilepc wird über mehrere Phasen schrittweise zurückgefahren. Solange du vor dem 1. Oktober 2026 migrierst, läuft alles ohne Eile.': 'epilepc verrà gradualmente dismesso in più fasi. Finché migri prima del 1° ottobre 2026, non c''è fretta.'
'Stilllegungs-Zeitleiste von epilepc': 'Calendario di dismissione di epilepc'
'heute': 'oggi'
'Migration offen': 'Migrazione aperta'
'Keine neuen Konten mehr': 'Nessun nuovo account'
'Hinweis verstärkt': 'Avviso rafforzato'
'Service stillgelegt': 'Servizio dismesso'
'Häufige Fragen': 'Domande frequenti'
'Verliere ich Daten beim Wechsel?': 'Perderò dati durante il passaggio?'
'Nein. Alle Anfälle, Ereignisse, Medikamente und Tagebucheinträge werden übertragen. Lediglich der freie Titel eines Anfalls wird mit der Beschreibung zusammengeführt — sonst bleibt alles erhalten.': 'No. Tutte le crisi, eventi, farmaci e voci del diario vengono trasferiti. Solo il titolo libero di una crisi viene unito alla sua descrizione — altrimenti tutto è preservato.'
'Kann ich es rückgängig machen?': 'Posso annullare?'
'Dein epilepc-Konto bleibt bis zum 31. Oktober 2026 bestehen und ist nach der Migration im Read-Only Modus. Du kannst deine ciphra-Daten zudem jederzeit als JSON oder CSV exportieren — das Format ist wieder importierbar.': 'Il tuo account epilepc rimane fino al 31 ottobre 2026 ed è in sola lettura dopo la migrazione. Puoi anche esportare i tuoi dati ciphra come JSON o CSV in qualsiasi momento — il formato è reimportabile.'
'Was passiert mit meinen alten PDFs für den Arzt?': 'Cosa succede ai miei vecchi PDF per il medico?'
'Bestehende PDFs auf deinem Gerät bleiben unverändert. Auf ciphra kannst du jederzeit neue Berichte erstellen — basierend auf den übertragenen Daten und dem Epilepsie-Blueprint.': 'I PDF esistenti sul tuo dispositivo rimangono invariati. Su ciphra puoi creare nuovi rapporti in qualsiasi momento — basati sui dati trasferiti e sul Blueprint Epilessia.'
'Wie lange dauert die Übertragung?': 'Quanto dura il trasferimento?'
'Bei 50 Anfällen rund 10 Sekunden. Bei 500 Anfällen bis zu 2 Minuten. Bricht die Verbindung ab, merkt sich ciphra, wo es war, und macht beim nächsten Öffnen des Links nahtlos weiter — ohne Duplikate.': 'Per 50 crisi, circa 10 secondi. Per 500 crisi, fino a 2 minuti. Se la connessione si interrompe, ciphra ricorda dove era e riprende senza interruzioni alla successiva apertura del link — senza duplicati.'
'Ist der Migrationslink sicher zu teilen?': 'Il link di migrazione è sicuro da condividere?'
'Nein. Der Link ist einmalig gültig und an dein epilepc-Konto gebunden. Behalte ihn für dich. Nach dem ersten erfolgreichen Öffnen ist er verbraucht.': 'No. Il link è valido una sola volta ed è legato al tuo account epilepc. Tienilo per te. Dopo la prima apertura riuscita, è consumato.'
'Kann ich später eine andere Diagnose hinzufügen?': 'Posso aggiungere un''altra diagnosi in seguito?'
'Ja. ciphra unterstützt mehrere Diagnosen pro Konto — du kannst jederzeit zusätzliche Blueprints aktivieren oder zwischen ihnen wechseln. In Planung für die Alpha-Phase: mehrere getrennte Vaults pro Konto, einer pro Diagnose.': 'Sì. ciphra supporta più diagnosi per account — puoi attivare Blueprint aggiuntivi o passare tra di loro in qualsiasi momento. In programma per la fase alpha: più vault separati per account, uno per diagnosi.'
'Warum gibt es einen Nachfolger?': 'Perché c''è un successore?'
'ciphra baut auf dem auf, was wir mit epilepc gelernt haben — mit neueren Werkzeugen, einem breiteren Diagnose-Bereich und Browser-seitiger Verschlüsselung. epilepc bleibt lesbar bis Ende Oktober 2026.': 'ciphra si basa su ciò che abbiamo imparato con epilepc — con strumenti più recenti, una gamma più ampia di diagnosi e cifratura lato browser. epilepc rimane leggibile fino alla fine di ottobre 2026.'
